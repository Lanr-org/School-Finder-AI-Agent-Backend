# Render Blueprint for Smetase (soft launch). See DEPLOY.md for the step-by-step.
#
# FREE SETUP until there is money for paid plans (see "Moving to paid plans" in DEPLOY.md):
# - PostgreSQL is on Neon's free plan (does not expire), not on Render: Render's free database is
#   deleted after 30 days. DATABASE_URL is pasted in the dashboard.
# - The API is a free web service: it sleeps after 15 min without traffic (an outside pinger keeps it
#   awake), and free services have no pre-deploy step or Shell, so migrations run at start-up.
# - Key Value is free: in memory only, so a restart drops jobs still waiting in the queue.
#
# DRAFT: domain is smetase.com (DNS on Cloudflare). Plan names and field names were written from
# Render's Blueprint spec but not validated against Render (no CLI here); the dashboard reports
# any mistake when you create the Blueprint, and each is a one-line fix.
#
# What it creates: the API (one process: web server + queue workers) and Key Value (Redis), in one
# region so the API reaches Redis over Render's private network. The web apps are on Cloudflare.
#
# Not included on purpose: Centrifugo. The staff app polls for notifications and nothing
# subscribes to Centrifugo; the API skips publishing when CENTRIFUGO_API_KEY is unset.

services:
  # ---- Key Value (Redis) ----
  - type: keyvalue
    name: smetase-redis
    region: frankfurt
    plan: free # in memory only: a restart loses queued jobs. Paid: starter (and it keeps data)
    # BullMQ stores its queues here; the default eviction policy could delete them under memory pressure.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

  # ---- API + workers ----
  - type: web
    name: smetase-api
    runtime: docker
    region: frankfurt
    plan: free # sleeps after 15 min idle; keep it awake with a pinger on /health/live. Paid: starter
    numInstances: 1 # one process for soft launch; the daily AI counters and workers assume it
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeployTrigger: "off" # deploy by hand until we trust the pipeline
    # /health/live, not /health/ready: ready queries the database, and Render's frequent checks would
    # keep Neon's free compute awake around the clock and use up its monthly hours.
    healthCheckPath: /health/live
    # Free services have no pre-deploy step, so migrations run just before the server starts (the
    # start:migrate script in package.json). Safe with one instance only. On a paid plan, remove this
    # line and go back to: preDeployCommand: npx prisma migrate deploy
    dockerCommand: npm run start:migrate
    domains:
      - api.smetase.com
    envVars:
      # Runtime
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Requests reach the app through Cloudflare and two Render hops; X-Forwarded-For arrives as
      # "<visitor>, <Cloudflare edge>, <Render 10.x>" (seen in the logs on 2026-10-14). Trusting 3
      # hops makes req.ip the visitor, so each visitor gets their own rate-limit bucket. With 1,
      # req.ip was Render's internal address and everyone shared one bucket.
      - key: TRUST_PROXY
        value: "3"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false

      # Data. DATABASE_URL = Neon's direct (not pooled) connection string, with ?sslmode=require.
      # Redis is filled in by Render over the private network.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smetase-redis
          property: connectionString

      # Where the two apps live. Must be https:// in production (the API refuses to start otherwise).
      - key: FRONTEND_URL
        value: https://hub.smetase.com
      - key: STUDENT_APP_URL
        value: https://app.smetase.com

      # Secrets generated once by Render (32+ random characters, all different from each other)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STUDENT_JWT_SECRET
        generateValue: true

      # Google sign-in (the client ID is public; the client secret is never used)
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Email (invitations and password resets)
      - key: EMAIL_FROM
        value: Smetase <no-reply@smetase.com>
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # Telegram. The webhook secret must be 1-256 characters of A-Z a-z 0-9 _ -
      # (so not Render's generated base64, which can contain + / =). Make one with `openssl rand -hex 32`.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://api.smetase.com/api/v1/webhooks/telegram

      # AI. Anthropic only at launch. To add fallbacks, also set OPENAI_API_KEY and/or
      # GEMINI_API_KEY in the dashboard and change LLM_FALLBACK_PROVIDERS (e.g. openai,gemini).
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_FALLBACK_PROVIDERS
        value: none
      - key: ANTHROPIC_API_KEY
        sync: false
      # Sonnet costs about half of Opus; answers lean on our stored school data, not the model.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5

      # Spending limits (also set a monthly limit in the Anthropic console as the hard ceiling)
      - key: AI_DAILY_REPLIES_PER_STUDENT
        value: "20"
      - key: AI_DAILY_REPLIES_GLOBAL
        value: "300"
      - key: TELEGRAM_MESSAGES_PER_MINUTE
        value: "20"
      - key: INTERVIEW_SESSIONS_PER_STUDENT_PER_DAY
        value: "1"

# The student app (app.smetase.com), staff app (hub.smetase.com) and landing page (smetase.com)
# are hosted on Cloudflare Pages, not here. See DEPLOY.md.
